<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" fill="none" role="img" aria-label="Transparent spread illustration: live mid-market rate with the spread shown up front">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae9b3"/>
      <stop offset="1" stop-color="#f7f5ef"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b90b"/>
      <stop offset="1" stop-color="#a37d07"/>
    </linearGradient>
  </defs>

  <rect width="900" height="680" rx="48" fill="url(#bg)"/>

  <!-- decorative rings -->
  <circle cx="742" cy="128" r="86" fill="none" stroke="#f0b90b" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="742" cy="128" r="58" fill="none" stroke="#f0b90b" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="150" cy="606" r="42" fill="#f0b90b" fill-opacity=".18"/>

  <!-- rate card -->
  <rect x="92" y="96" width="716" height="300" rx="32" fill="#ffffff" stroke="#ddd8cc"/>
  <text x="136" y="158" fill="#1c1c1c" font-family="Lexend, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1">LIVE MID-MARKET RATE</text>

  <text x="136" y="240" fill="#1c1c1c" font-family="Lexend, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">1 CAD = 1.3651 USD</text>

  <line x1="136" y1="288" x2="764" y2="288" stroke="#ddd8cc"/>
  <text x="136" y="336" fill="#1c1c1c" fill-opacity=".66" font-family="Lexend, Arial, sans-serif" font-size="24" font-weight="400">Bank-style markup hidden in the rate</text>
  <text x="764" y="336" fill="#1c1c1c" fill-opacity=".4" text-anchor="end" font-family="Lexend, Arial, sans-serif" font-size="24" font-weight="600" text-decoration="line-through">1.3389</text>

  <!-- spread row -->
  <rect x="92" y="432" width="716" height="120" rx="32" fill="#1c1c1c"/>
  <circle cx="160" cy="492" r="32" fill="#f0b90b"/>
  <path d="M147 492l9 9 18-20" stroke="#1c1c1c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="216" y="484" fill="#ffffff" font-family="Lexend, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1">SPREAD SHOWN BEFORE YOU CONFIRM</text>
  <text x="216" y="516" fill="#fae9b3" font-family="Lexend, Arial, sans-serif" font-size="20" font-weight="400">0.35 % · no hidden markup</text>

  <!-- rate bars -->
  <rect x="560" y="470" width="76" height="14" rx="7" fill="url(#bar)" opacity=".9"/>
  <rect x="560" y="496" width="140" height="14" rx="7" fill="#f0b90b" opacity=".5"/>
  <rect x="560" y="522" width="104" height="14" rx="7" fill="#f0b90b" opacity=".3"/>

  <!-- floating chip -->
  <g transform="translate(660 40) rotate(8)">
    <rect width="196" height="64" rx="32" fill="#f0b90b"/>
    <text x="98" y="41" text-anchor="middle" fill="#1c1c1c" font-family="Lexend, Arial, sans-serif" font-size="22" font-weight="600">TRANSPARENT</text>
  </g>
</svg>
