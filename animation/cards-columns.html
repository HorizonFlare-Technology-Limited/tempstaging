<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='24' rx='4' fill='%2315191f' stroke='%23c9d6e6' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/site-nav.css">
<style>
:root{--bg:#08090b;--ink:#eef2f7;--ink-soft:#aeb7c4;--line:rgba(226,234,244,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background-color:var(--bg);
 background-image:radial-gradient(1100px 640px at 50% -6%,rgba(56,67,82,.55),rgba(8,9,11,0) 68%),radial-gradient(900px 700px at 82% 18%,rgba(43,51,63,.32),rgba(8,9,11,0) 62%),radial-gradient(700px 700px at 8% 78%,rgba(30,36,46,.4),rgba(8,9,11,0) 70%);
 background-attachment:fixed;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:20px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.08em;color:var(--ink);text-decoration:none}
.stage{position:relative;flex:1 1 auto;min-height:0}
#stage-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px 16px;flex-wrap:wrap}
.bar button{font:600 12px/1 system-ui,sans-serif;letter-spacing:.06em;color:#cfd3dc;background:rgba(12,14,20,.72);border:1px solid var(--line);border-radius:999px;padding:10px 14px;cursor:pointer}
.bar button[aria-pressed="true"]{background:#3b4256;color:#fff;border-color:#8b94b0}
.bar kbd{opacity:.55;margin-left:6px;font:inherit}
#stage-error{position:absolute;left:16px;top:16px;color:#ff9a86}
.stage-veil{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft)}
.stage-veil[hidden]{display:none}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body data-material="satin" data-playing="0" data-qa-ready="0" data-qa-errors="0">
  <header>
    <a class="brand" href="./cards-columns.html">TEKO &middot; Cards on Columns</a>
    <nav class="site-nav" aria-label="Collections">
      <a href="./">Coin</a>
      <a href="./card.html">Metal Card</a>
      <a href="./columns.html">Columns</a>
      <span class="site-nav-current" aria-current="page">Cards on Columns</span>
      <a href="./billing.html">Billing</a>
    </nav>
  </header>
  <h1 style="position:absolute;left:-9999px">TEKO Cards on Columns: a dark and a light card lean onto a low and a high column</h1>
  <div class="stage" id="stage">
    <canvas id="stage-canvas" aria-label="3D scene: two metal cards lean onto a high column while the camera orbits"></canvas>
    <p id="stage-error" hidden></p>
    <div class="stage-veil" id="stage-veil">Loading</div>
  </div>
  <div class="bar" role="group" aria-label="Controls">
    <button id="btn-play" type="button" aria-keyshortcuts="R Space">Replay <kbd>R</kbd></button>
    <button type="button" data-material="plaster" aria-pressed="false">Plaster <kbd>1</kbd></button>
    <button type="button" data-material="reeded-metal" aria-pressed="false">Reeded Metal <kbd>2</kbd></button>
    <button type="button" data-material="satin" aria-pressed="true">Satin <kbd>3</kbd></button>
    <button type="button" data-material="grain-metal" aria-pressed="false">Grain Metal <kbd>4</kbd></button>
    <button type="button" data-material="titanium" aria-pressed="false">Titanium <kbd>5</kbd></button>
  </div>
  <script type="module" src="./src/cards-columns-scene.js"></script>
</body>
</html>
